name: Cash App CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy_live:
        description: Deploy this app to live Firebase Hosting
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cashapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy to Firebase Hosting
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CASHAPP_A213F }}
          channelId: live
          projectId: cashapp-a213f
